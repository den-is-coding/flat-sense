# Правила генерации Go-кода (issue #2): результат кладётся в pkg/proto
# рядом с пакетом контракта (paths=source_relative). Плагины ставятся
# go install с зафиксированными версиями — см. scripts/genproto.sh.
version: v2
plugins:
  - local: protoc-gen-go
    out: ../pkg/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../pkg/proto
    opt: paths=source_relative
