# ============================================================
# СЕТИ И ТОМА
# ============================================================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:

# ============================================================
# ОБЩИЕ НАСТРОЙКИ ЛОГИРОВАНИЯ
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ============================================================
# ОБЩИЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ
# ============================================================
x-common-env: &common-env
  KAFKA_BROKERS: kafka:9092
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER:-analyzer}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
  DB_NAME: ${POSTGRES_DB:-analyzer}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AUTH_GRPC_ADDR: auth-service:50051
  ADS_GRPC_ADDR: ads-service:50052
  STAGING_GRPC_ADDR: staging-service:50053
  NOTIFICATION_GRPC_ADDR: notification-service:50054
  PAYMENT_GRPC_ADDR: payment-service:50055

# ============================================================
# БАЗОВЫЙ ШАБЛОН ДЛЯ GO-СЕРВИСОВ (без volumes)
# ============================================================
x-go-service: &go-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_started    # используем started, т.к. healthcheck Kafka нестабилен
    minio:
      condition: service_healthy
  logging: *default-logging
  networks:
    - app-network

# ============================================================
# СЕРВИСЫ
# ============================================================
services:
  # ==================== ИНФРАСТРУКТУРА ====================
  postgres:
    image: postgres:15-alpine
    container_name: real-estate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-analyzer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyzer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: real-estate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: real-estate-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'     # важно для внутренней сети
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'Mk3K1R6yQfqZ1t5J5l5gRw'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: real-estate-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    logging: *default-logging
    networks:
      - app-network

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: real-estate-kafka-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Waiting for Kafka...'
      sleep 10
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic parse-requests --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic parsed-ads --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic image-analysis-requests --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic analysis-results --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic email-notifications --partitions 3 --replication-factor 1
      echo 'Topics created!'
      "
    logging: *default-logging
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: real-estate-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    networks:
      - app-network

  minio-init:
    image: minio/mc:latest
    container_name: real-estate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/ads-photos;
      /usr/bin/mc policy set download myminio/ads-photos;
      exit 0;
      "
    logging: *default-logging
    networks:
      - app-network

  # ==================== МИКРОСЕРВИСЫ ====================
  # Каждый сервис теперь монтирует только свою папку
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-auth
    <<: *go-service
    volumes:
      - ../services/auth-service:/app   # явное монтирование
    environment:
      <<: *common-env
      GRPC_PORT: 50051
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
      - "50051:50051"
    command: ["air", "-c", ".air.toml"]   # теперь air работает в /app, где лежит его код

  ads-service:
    build:
      context: ../services/ads-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-ads
    <<: *go-service
    volumes:
      - ../services/ads-service:/app
    environment:
      <<: *common-env
      GRPC_PORT: 50052
    ports:
      - "50052:50052"
    command: ["air", "-c", ".air.toml"]

  parser-service:
    build:
      context: ../services/parser-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-parser
    <<: *go-service
    volumes:
      - ../services/parser-service:/app
    environment:
      <<: *common-env
      # Парсер Авито: российские резидентные/мобильные прокси (обязательно),
      # см. README раздел "Парсер Авито".
      AVITO_PROXIES: ${AVITO_PROXIES:-}
      AVITO_PROXY_ROTATION_URL: ${AVITO_PROXY_ROTATION_URL:-}
      AVITO_COOKIES: ${AVITO_COOKIES:-}
      AVITO_MIN_DELAY_MS: ${AVITO_MIN_DELAY_MS:-2000}
      AVITO_MAX_DELAY_MS: ${AVITO_MAX_DELAY_MS:-6000}
      PARSE_MAX_PAGES: ${PARSE_MAX_PAGES:-0}
      PARSE_FETCH_DETAILS: "1"
      # Админка (issue #57): креды из deploy/.env
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
    ports:
      - "8088:8080"   # админка /admin (issue #57)
    command: ["air", "-c", ".air.toml"]

  image-ai-service:
    build:
      context: ../services/image-ai-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-image-ai
    <<: *go-service
    volumes:
      - ../services/image-ai-service:/app
    environment:
      <<: *common-env
      HTTP_PORT: 8080
    ports:
      - "8089:8080"   # API детекции планировок (issue #58)
    command: ["air", "-c", ".air.toml"]

  analyzer-service:
    build:
      context: ../services/analyzer-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-analyzer
    <<: *go-service
    volumes:
      - ../services/analyzer-service:/app
    environment:
      <<: *common-env
    command: ["air", "-c", ".air.toml"]

  staging-service:
    build:
      context: ../services/staging-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-staging
    <<: *go-service
    volumes:
      - ../services/staging-service:/app
    environment:
      <<: *common-env
      GRPC_PORT: 50053
    ports:
      - "50053:50053"
    command: ["air", "-c", ".air.toml"]

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-notification
    <<: *go-service
    volumes:
      - ../services/notification-service:/app
    environment:
      <<: *common-env
      GRPC_PORT: 50054
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
    ports:
      - "50054:50054"
    command: ["air", "-c", ".air.toml"]

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-payment
    <<: *go-service
    volumes:
      - ../services/payment-service:/app
    environment:
      <<: *common-env
      GRPC_PORT: 50055
    ports:
      - "50055:50055"
    command: ["air", "-c", ".air.toml"]

  proxy-manager:
    build:
      context: ../services/proxy-manager
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-proxy
    <<: *go-service
    volumes:
      - ../services/proxy-manager:/app
    environment:
      <<: *common-env
      HTTP_PORT: 8001
    ports:
      - "8001:8001"
    command: ["air", "-c", ".air.toml"]

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      target: ${TARGET:-dev}
    container_name: real-estate-gateway
    <<: *go-service
    volumes:
      - ../services/api-gateway:/app
    environment:
      <<: *common-env
      HTTP_PORT: 80
    ports:
      - "80:80"
    command: ["air", "-c", ".air.toml"]

  # ==================== МИГРАЦИИ ====================
  migrate:
    image: migrate/migrate:latest
    container_name: real-estate-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-analyzer}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-analyzer}?sslmode=disable
    entrypoint: ["migrate", "-path", "/migrations", "-database", "$DATABASE_URL"]
    command: ["up"]
    networks:
      - app-network